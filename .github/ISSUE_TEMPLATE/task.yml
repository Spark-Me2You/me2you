name: Task
description: Refactor, style, performance, tests, docs, tooling or other non-feature work
title: "chore: "
body:
  - type: markdown
    attributes:
      value: |
        Triage adds the `type:*` label from the title prefix. Change `chore:` to `refactor:`, `style:`, `perf:`, `test:` or `docs:` if one fits better. See docs/AGENT_WORKFLOW.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app is affected? (Triage adds the matching `area:*` label.)
      multiple: true
      options:
        - kiosk (state machine, idle/auth/onboarding)
        - hub
        - discovery
        - games
        - cv (camera, hand tracking, pose)
        - mobile (user pages, registration, claim, messages)
        - auth
        - db (migrations, RLS, edge functions)
        - ci / tooling
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: pointers
    attributes:
      label: Code pointers
