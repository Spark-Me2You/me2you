name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: # used by agent.yml to run CI on agent PR branches

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # Lint is a ratchet: the number is the current warning count. Lower it as
      # warnings are fixed, never raise it.
      - run: npm run lint -- --max-warnings 34
      - run: npm run build
      # Enforces the coverage floor set in vitest.config.ts.
      - run: npm run test:coverage
      # Informational for now: reports known vulnerabilities in production deps.
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  # The Deno edge functions are not covered by tsc. Never run before, so it may
  # surface existing errors: make it blocking (remove continue-on-error) once
  # it is green.
  edge-functions:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
