# Issue agent: `agent:ready` runs Claude Code on an issue and opens a draft PR.
# Jobs are split so code the agent writes never runs next to a write token; keep
# it that way. See docs/AGENT_WORKFLOW.md.
name: Agent

on:
  issues:
    types: [labeled]
  # Feedback and retry workflows call this reusable workflow from trusted main.
  # Fresh runs still require an admin to add `agent:ready`.
  workflow_call:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      branch:
        description: Existing agent/<issue>-<slug> branch to continue on
        required: true
        type: string
      reason:
        description: Continuation source, `feedback` or `ci`
        required: true
        type: string
      initiator:
        description: Admin who requested feedback
        required: false
        default: ''
        type: string
      expected_sha:
        description: Expected commit at the existing branch head
        required: true
        type: string

concurrency:
  group: agent-issue-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: false
env:
  GH_REPO: ${{ github.repository }}
  ISSUE: ${{ inputs.issue || github.event.issue.number }}
  RETRY_BRANCH: ${{ inputs.branch }}
  REASON: ${{ inputs.reason }}
  INITIATOR: ${{ inputs.initiator }}
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # No environment, so refused runs never get near the Claude token.
  gate:
    if: github.event.label.name == 'agent:ready' || inputs.reason != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      model: ${{ steps.claim.outputs.model }}
    steps:
      - name: Check the request and pick a model
        id: gate
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          # Continuation callers claim the issue before calling this workflow.
          # A refusal hands it back without exposing the Claude environment.
          refuse() {
            gh issue edit "$ISSUE" --remove-label agent:ready --remove-label agent:in-progress --add-label agent:needs-human || true
            gh issue comment "$ISSUE" --body "Agent not started: $1 [Run log]($RUN_URL)" || true
            exit 0
          }

          is_admin() {
            local permission
            permission=$(gh api "repos/$GH_REPO/collaborators/$1/permission" \
              --jq '.user.permissions.admin == true' 2>/dev/null) || return 1
            [[ "$permission" == true ]]
          }

          deny_non_admin() {
            # Do not clear another run's in-progress label when an unrelated
            # user attempts a direct start.
            gh issue edit "$ISSUE" --remove-label agent:ready || true
            gh issue comment "$ISSUE" --body "Agent not started: @$1 must be a current repository owner/admin. [Run log]($RUN_URL)" || true
            exit 0
          }

          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "Invalid issue number."; exit 0; }

          if [[ -n "$REASON" ]]; then
            # Reusable calls must inherit a trusted default-branch event. This
            # rejects calls from pull-request merge refs and other branches.
            [[ "$GITHUB_REF" == "refs/heads/main" ]] \
              || refuse "continuations must be called from the trusted workflow on \`main\`."
            if [[ ! "$RETRY_BRANCH" =~ ^agent/$ISSUE-[a-z0-9-]+$ ||
                  ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              refuse "invalid continuation branch or expected commit."
            fi

            case "$REASON" in
              feedback)
                [[ "$EVENT" == "issue_comment" && -n "$INITIATOR" && "$ACTOR" == "$INITIATOR" ]] \
                  || refuse "feedback must come from the matching issue-comment initiator."
                is_admin "$INITIATOR" \
                  || refuse "the feedback initiator is not a current repository owner/admin."
                ;;
              ci)
                [[ "$EVENT" == "workflow_run" && -z "$INITIATOR" ]] \
                  || refuse "CI retries must come from the retry workflow without an initiator."
                ;;
              *)
                refuse "invalid continuation reason \`$REASON\`."
                ;;
            esac

            branch_sha=$(gh api "repos/$GH_REPO/git/ref/heads/$RETRY_BRANCH" \
              --jq '.object.sha' 2>/dev/null) \
              || refuse "the existing branch could not be verified."
            [[ "$branch_sha" == "$EXPECTED_SHA" ]] \
              || refuse "the existing branch no longer matches the expected commit."
          else
            # Fresh starts only come from the agent:ready label event. The
            # labeler must still be an admin when this workflow runs.
            [[ "$EVENT" == "issues" && "${{ github.event.action }}" == "labeled" &&
               "${{ github.event.label.name }}" == "agent:ready" ]] \
              || { echo "Not an agent:ready issue-label event."; exit 0; }
            [[ -z "$RETRY_BRANCH" && -z "$INITIATOR" && -z "$EXPECTED_SHA" ]] \
              || refuse "fresh starts cannot supply continuation inputs."
            is_admin "$ACTOR" || deny_non_admin "$ACTOR"
          fi

          labels=$(gh issue view "$ISSUE" --json labels --jq '.labels[].name')
          if grep -qxE 'type:db|area:db' <<<"$labels"; then
            refuse "database work (migrations, RLS, edge functions) is reserved for humans."
          fi

          # Only labels in this map are honored; the label is never passed to the
          # CLI as-is. Values are Claude Code model aliases, which resolve to the
          # newest model of that family in the pinned claude-code-action.
          declare -A models=( [model:sonnet]=sonnet [model:opus]=opus )
          picked=()
          for l in "${!models[@]}"; do
            if grep -qxF "$l" <<<"$labels"; then picked+=("$l"); fi
          done
          if [[ ${#picked[@]} -gt 1 ]]; then
            refuse "multiple model labels (${picked[*]}). Keep one and re-add \`agent:ready\`."
          fi
          echo "model=${models[${picked[0]:-model:sonnet}]}" >> "$GITHUB_OUTPUT"

      - name: Claim issue
        if: steps.gate.outputs.model != ''
        id: claim
        env:
          MODEL: ${{ steps.gate.outputs.model }}
        run: |
          gh issue edit "$ISSUE" --remove-label agent:ready --remove-label agent:needs-human --remove-label agent:review --add-label agent:in-progress
          # Every run except a CI retry carries a marker, and agent-retry.yml
          # counts retries since the latest one, so each new admin-started
          # attempt (agent:ready or /agent feedback) gets a fresh retry budget.
          marker='<!-- agent-run -->'
          [[ "$REASON" == "ci" && -n "$RETRY_BRANCH" ]] && marker=''
          gh issue comment "$ISSUE" --body "${marker}Agent started working on this issue using \`$MODEL\`. [Run log]($RUN_URL)"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

  # Claude edits files here with read/write tools only. Trusted shell packages
  # the result; no repository code or project command runs beside the token.
  work:
    needs: gate
    if: needs.gate.outputs.model != ''
    runs-on: ubuntu-latest
    environment: agent
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      branch: ${{ steps.branch.outputs.name }}
      base: ${{ steps.branch.outputs.base }}
      lease: ${{ steps.branch.outputs.lease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Create branch and write issue context
        id: branch
        env:
          GH_TOKEN: ${{ github.token }} # read-only, and scoped to this step
        run: |
          if [[ -n "$RETRY_BRANCH" ]]; then
            # Retry: continue on the existing branch so earlier commits are kept.
            branch="$RETRY_BRANCH"
            git switch -c "$branch" "origin/$branch"
          else
            slug=$(gh issue view "$ISSUE" --json title --jq .title \
              | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//')
            branch="agent/$ISSUE-$slug"
            git switch -c "$branch"
          fi
          if [[ -n "$EXPECTED_SHA" && "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "Existing branch changed after the continuation was validated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p .agent
          echo ".agent/" >> .git/info/exclude
          gh issue view "$ISSUE" --json number,title,body,labels,comments > .agent/issue.json

          # On a revision, collect only PR conversation comments. Review bodies
          # and inline review comments cannot trigger /agent and are not prompt input.
          pr=''
          if [[ -n "$RETRY_BRANCH" ]]; then
            prs=$(gh pr list --state open --base dev --limit 200 \
              --json number,author,baseRefName,headRefName,headRepository,headRepositoryOwner)
            pr=$(jq -r --arg repo "$GH_REPO" --arg branch "$RETRY_BRANCH" '
              [.[] | select(
                .author.login == "github-actions" and .baseRefName == "dev" and
                ((.headRepositoryOwner.login // "") + "/" + (.headRepository.name // "")) == $repo and .headRefName == $branch
              )] | if length == 1 then .[0].number else empty end' <<<"$prs")
            if [[ -n "$pr" ]]; then
              gh pr view "$pr" --json comments > .agent/pr.json
            fi
          fi

          # The issue body was vouched for by the admin who started the run.
          # Include comments only from current repository admins and Actions.
          trusted='["github-actions"]'
          {
            jq -r '.comments[].author.login' .agent/issue.json
            if [[ -f .agent/pr.json ]]; then jq -r '.comments[].author.login' .agent/pr.json; fi
          } | sort -u | while read -r login; do
            [[ -n "$login" && "$login" != "github-actions" ]] || continue
            permission=$(gh api "repos/$GH_REPO/collaborators/$login/permission" \
              --jq '.user.permissions.admin == true' 2>/dev/null) || permission=false
            if [[ "$permission" == true ]]; then
              printf '%s\n' "$login"
            fi
          done > .agent/admin-logins
          while read -r login; do
            trusted=$(jq -c --arg login "$login" '. + [$login] | unique' <<<"$trusted")
          done < .agent/admin-logins

          jq -r --argjson trusted "$trusted" '
            def ok($l): ($trusted | index($l)) != null;
            "# #\(.number): \(.title)\n\nLabels: \([.labels[].name] | join(", "))\n\n\(.body)\n\n## Comments\n\n"
            + (.comments | map(select(ok(.author.login))) | map("### @\(.author.login)\n\n\(.body)") | join("\n\n"))' \
            .agent/issue.json > .agent/issue.md

          if [[ -f .agent/pr.json ]]; then
            {
              printf '\n\n## PR #%s conversation feedback\n\n' "$pr"
              jq -r --argjson trusted "$trusted" '
                def ok($l): ($trusted | index($l)) != null;
                .comments | map(select(ok(.author.login))) |
                map("### PR comment by @\(.author.login)\n\n\(.body)") | join("\n\n")' .agent/pr.json
            } >> .agent/issue.md
          fi

          echo "name=$branch" >> "$GITHUB_OUTPUT"
          # The commit the agent starts from; publish only accepts commits on top of it.
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Where the remote branch was at checkout (empty if it didn't exist).
          # publish pushes with this as the lease, so commits a human pushes
          # during the run are never overwritten.
          echo "lease=$(git rev-parse -q --verify "refs/remotes/origin/$branch" || true)" >> "$GITHUB_OUTPUT"

      - name: Run Claude
        id: claude
        # Pinned to v1.0.266: this step holds the Claude token.
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are working on GitHub issue #${{ env.ISSUE }} in ${{ github.repository }}.
            The issue, its labels and comments are in `.agent/issue.md`. Read it first, then read
            CLAUDE.md and docs/GIT_CONVENTIONS.md and follow them.

            You are already on branch `${{ steps.branch.outputs.name }}`, created from `dev`.
            ${{ inputs.reason == 'ci' && inputs.branch && 'This is a retry: the branch already holds your earlier commits and CI failed on them. The latest issue comment has the failing output. Fix that failure with the smallest change, and do not redo finished work.' || '' }}
            ${{ inputs.reason == 'feedback' && 'This is a revision: a human reviewed your previous attempt and left feedback in the issue comments and PR sections of .agent/issue.md. Address that feedback, the newest comments first. Keep finished work that was not criticised. If the feedback conflicts with the issue, follow the feedback and say so in pr_body. pr_title and pr_body must describe the whole PR, not only this revision.' || '' }}
            ${{ inputs.reason == 'feedback' && inputs.branch && 'The branch already holds your earlier commits.' || '' }}

            Rules:
            - Implement what the issue asks, nothing more. Keep the diff focused.
            - Do not modify `supabase/`, `.github/`, `.env*`, or `package.json` dependencies.
            - Add or update unit tests for logic you change, where practical. Do not run them here.
              A fresh job without the Claude credential runs all project checks after you finish.
            - Do not run commands, commit, switch branches or push. Trusted workflow steps create the
              commit after your editing tools return.
            - The runner used for later checks has no camera, MediaPipe, WebGL or Supabase. If
              behaviour can only be confirmed on the kiosk hardware, say so in the PR body under "Manual verification".
            - If the issue is ambiguous, needs database changes, or you cannot complete it without
              executing project code, stop and return status `needs_human` with a short explanation
              and the specific questions a human should answer. Do not guess at requirements.

            Finish with structured output:
            - `status`: `done` or `needs_human`
            - `pr_title`: `<type>: <imperative summary>` (72 chars max), following GIT_CONVENTIONS
            - `pr_body`: markdown with "Summary", "Changes", "Testing" and, if relevant,
              "Manual verification" sections. No AI attribution.
            - `reason`: one or two sentences for the issue comment
          claude_args: |
            --model ${{ needs.gate.outputs.model }}
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep"
            --disallowedTools "Bash,Edit(.git/**),Write(.git/**),Edit(supabase/**),Write(supabase/**),Edit(.github/**),Write(.github/**),Edit(.env*),Write(.env*),Edit(package-lock.json),Write(package-lock.json)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["done","needs_human"]},"pr_title":{"type":"string"},"pr_body":{"type":"string"},"reason":{"type":"string"}},"required":["status","reason"]}'

      - name: Validate output, commit, and package result
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          out="$RUNNER_TEMP/agent-result"
          mkdir -p "$out"
          printf '%s' "$RESULT" > "$out/result.json"

          jq -e '
            type == "object" and
            (.status == "done" or .status == "needs_human") and
            (.reason | type == "string") and
            (if .status == "done" then
              (.pr_title | type == "string") and (.pr_body | type == "string")
            else true end)
          ' "$out/result.json" >/dev/null

          status=$(jq -r .status "$out/result.json")
          [[ "$status" == done ]] || exit 0
          [[ "$(git rev-parse HEAD)" == "$BASE" ]] || {
            echo "The working tree moved away from its validated base commit."
            exit 1
          }

          title=$(jq -r .pr_title "$out/result.json")
          if [[ "$title" == *$'\n'* || "$title" == *$'\r'* || "$title" == *. ||
                ${#title} -gt 72 ||
                ! "$title" =~ ^(feat|fix|refactor|style|docs|chore|perf|test):\ [[:graph:]]([[:print:]]*[[:graph:]])?$ ]]; then
            title='chore: apply agent changes'
            jq --arg title "$title" '.pr_title = $title' "$out/result.json" > "$out/result.tmp"
            mv "$out/result.tmp" "$out/result.json"
          fi

          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "$title"
          git bundle create "$out/commits.bundle" "$BASE..HEAD"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-result
          path: ${{ runner.temp }}/agent-result
          retention-days: 1
          if-no-files-found: error

  # Executes the candidate only in a fresh job with no Environment secrets and
  # no persisted checkout credential. A needs_human result skips project checks
  # but still succeeds so publish can update the issue.
  validate:
    needs: [gate, work]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: agent-result
          path: ${{ runner.temp }}/agent-result

      - name: Load candidate commit
        id: candidate
        env:
          BASE: ${{ needs.work.outputs.base }}
        run: |
          result="$RUNNER_TEMP/agent-result/result.json"
          bundle="$RUNNER_TEMP/agent-result/commits.bundle"
          status=$(jq -r '.status // empty' "$result" 2>/dev/null)
          if [[ "$status" == needs_human ]]; then
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$status" == done && -f "$bundle" && "$BASE" =~ ^[0-9a-f]{40}$ ]]
          git fetch -q "$bundle" HEAD
          head=$(git rev-parse FETCH_HEAD)
          git merge-base --is-ancestor "$BASE" "$head"
          git -c core.hooksPath=/dev/null checkout --detach "$head"
          echo "run_checks=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.candidate.outputs.run_checks == 'true'
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.candidate.outputs.run_checks == 'true'
        run: npm ci

      - name: Lint
        if: steps.candidate.outputs.run_checks == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.candidate.outputs.run_checks == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.candidate.outputs.run_checks == 'true'
        run: npm run build

      - name: Test
        if: steps.candidate.outputs.run_checks == 'true'
        run: npm test

  # Holds the write token but runs no repo code: only git, gh and jq on the
  # artifact, which it treats as untrusted (it was written next to agent code).
  publish:
    needs: [gate, work, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write # dispatch CI on the agent branch
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ needs.work.outputs.branch }}
      BASE: ${{ needs.work.outputs.base }}
      LEASE: ${{ needs.work.outputs.lease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: agent-result
          path: ${{ runner.temp }}/agent-result

      - name: Push branch and open draft PR
        run: |
          result="$RUNNER_TEMP/agent-result/result.json"
          bundle="$RUNNER_TEMP/agent-result/commits.bundle"
          status=$(jq -r '.status // "needs_human"' "$result" 2>/dev/null || echo needs_human)
          reason=$(jq -r '.reason // "No explanation returned."' "$result" 2>/dev/null || echo "No explanation returned.")

          needs_human() {
            gh issue edit "$ISSUE" --remove-label agent:in-progress --add-label agent:needs-human
            gh issue comment "$ISSUE" --body "Agent needs a human: $1

          [Run log]($RUN_URL)"
            exit 0
          }

          [[ "$status" == "done" ]] || needs_human "$reason"
          [[ -f "$bundle" ]] || needs_human "No new commits were made. $reason"
          [[ "$BRANCH" =~ ^agent/$ISSUE-[a-z0-9-]*$ && "$BASE" =~ ^[0-9a-f]{40}$ ]] \
            || needs_human "The run produced an unexpected branch or base commit."
          git fetch -q "$bundle" HEAD || needs_human "The agent's commits could not be read."
          head=$(git rev-parse FETCH_HEAD)
          git merge-base --is-ancestor "$BASE" "$head" \
            || needs_human "The agent's commits are not on top of the commit it started from."
          # Same limits as the prompt: no supabase/, .github/, .env* or lockfile
          # changes, and no dependency changes in package.json.
          if git diff --name-only "origin/dev...$head" | grep -qE '^(supabase/|\.github/|\.env|package-lock\.json$)'; then
            needs_human "The change touches \`supabase/\`, \`.github/\`, \`.env*\` or \`package-lock.json\`, which agents may not modify."
          fi
          deps='{dependencies, devDependencies, peerDependencies, optionalDependencies}'
          fork=$(git merge-base origin/dev "$head")
          if [[ "$(git show "$fork:package.json" | jq -S "$deps")" != "$(git show "$head:package.json" | jq -S "$deps" 2>/dev/null)" ]]; then
            needs_human "The change edits dependencies in \`package.json\`, which agents may not do."
          fi

          [[ -z "$LEASE" || "$LEASE" =~ ^[0-9a-f]{40}$ ]] || needs_human "The run produced an unexpected lease commit."
          git push --force-with-lease="refs/heads/$BRANCH:$LEASE" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$head:refs/heads/$BRANCH" \
            || needs_human "The push to \`$BRANCH\` was rejected, most likely because someone pushed to it during the run, so nothing was overwritten. Check the branch, then send \`/agent\` or re-add \`agent:ready\`."

          title=$(jq -r '.pr_title // empty' "$result")
          [[ -n "$title" ]] || title=$(gh issue view "$ISSUE" --json title --jq .title)
          {
            jq -r '.pr_body // ""' "$result"
            printf '\n\nCloses #%s\n\n---\nAutomated PR from the agent workflow. [Run log](%s)\n' "$ISSUE" "$RUN_URL"
          } > "$RUNNER_TEMP/pr-body.md"

          pr=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [[ -z "$pr" ]]; then
            pr=$(gh pr create --draft --base dev --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md")
          else
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          fi

          # PRs opened with GITHUB_TOKEN don't trigger pull_request workflows,
          # so dispatch CI on the branch to produce the required `ci` check.
          gh workflow run ci.yml --ref "$BRANCH"

          gh issue edit "$ISSUE" --remove-label agent:in-progress --add-label agent:review
          gh issue comment "$ISSUE" --body "Agent opened $pr for review. $reason"

  # Any failure or cancellation (including the 60-minute timeout) after the
  # issue was claimed hands it back, so it never sticks on agent:in-progress.
  report:
    needs: [gate, work, validate, publish]
    if: >-
      always() && needs.gate.outputs.model != '' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report failure
        run: |
          gh issue edit "$ISSUE" --remove-label agent:in-progress --add-label agent:needs-human
          gh issue comment "$ISSUE" --body "Agent run failed. [Run log]($RUN_URL)"
