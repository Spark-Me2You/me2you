# Agent feedback: an issue or PR conversation comment starting with `/agent`
# validates the request, then calls the trusted agent workflow on main.
name: Agent feedback

on:
  issue_comment:
    types: [created]

jobs:
  prepare:
    if: >-
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '/agent')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      start: ${{ steps.prepare.outputs.start }}
      issue: ${{ steps.prepare.outputs.issue }}
      branch: ${{ steps.prepare.outputs.branch }}
      initiator: ${{ steps.prepare.outputs.initiator }}
      expected_sha: ${{ steps.prepare.outputs.expected_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      BODY: ${{ github.event.comment.body }}
      NUMBER: ${{ github.event.issue.number }}
      IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Validate and prepare feedback
        id: prepare
        run: |
          # "/agent" must be the command word, not a prefix of another word.
          [[ "$BODY" =~ ^/agent([[:space:]]|$) ]] || exit 0

          # Every command spends an owner's subscription quota. Check the
          # commenter's current repository permission and fail closed if the API fails.
          permission=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" \
            --jq '.user.permissions.admin == true' 2>/dev/null) || permission=false
          if [[ "$permission" != true ]]; then
            echo "$ACTOR is not a current repository owner/admin."
            exit 0
          fi

          fields=state,author,baseRefName,headRefName,headRepository,headRepositoryOwner
          if [[ "$IS_PR" == "true" ]]; then
            # PR conversation comments are issue_comment events. Only accept the
            # repository's open bot-authored agent PRs into dev.
            pr=$(gh pr view "$NUMBER" --json "$fields") || { echo "Could not read PR #$NUMBER."; exit 0; }
            valid=$(jq -r --arg repo "$GH_REPO" '
              .state == "OPEN" and .baseRefName == "dev" and
              .author.login == "github-actions" and
              ((.headRepositoryOwner.login // "") + "/" + (.headRepository.name // "")) == $repo' <<<"$pr")
            branch=$(jq -r '.headRefName' <<<"$pr")
            if [[ "$valid" != true || ! "$branch" =~ ^agent/[0-9]+-[a-z0-9-]+$ ]]; then
              echo "PR #$NUMBER is not an open bot-authored agent PR from this repository into dev."
              exit 0
            fi
            [[ "$branch" =~ ^agent/([0-9]+)-[a-z0-9-]+$ ]]
            issue="${BASH_REMATCH[1]}"
            sha=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null) \
              || { echo "Could not verify the PR branch commit."; exit 0; }
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Unexpected PR branch commit."; exit 0; }
          else
            issue="$NUMBER"
            [[ "$issue" =~ ^[0-9]+$ ]] || exit 0

            # Search a deliberately high result limit and require exactly one
            # matching PR. Ambiguity is refused rather than choosing one.
            prs=$(gh pr list --state open --base dev --limit 200 --json "$fields") || {
              gh issue comment "$issue" --body "Couldn't verify the agent PR for this feedback. [Run log]($RUN_URL)"
              exit 0
            }
            matches=$(jq -c --arg repo "$GH_REPO" --arg prefix "agent/$issue-" '
              [.[] | select(
                .state == "OPEN" and .baseRefName == "dev" and
                .author.login == "github-actions" and
                ((.headRepositoryOwner.login // "") + "/" + (.headRepository.name // "")) == $repo and
                (.headRefName | startswith($prefix))
              )]' <<<"$prs")
            count=$(jq 'length' <<<"$matches")
            if [[ "$count" != 1 ]]; then
              gh issue comment "$issue" --body "\`/agent\` requires exactly one open bot-authored agent PR from this repository into \`dev\`; found $count. [Run log]($RUN_URL)"
              exit 0
            fi
            branch=$(jq -r '.[0].headRefName' <<<"$matches")
            if [[ ! "$branch" =~ ^agent/$issue-[a-z0-9-]+$ ]]; then
              gh issue comment "$issue" --body "The matching agent PR has an unexpected branch. [Run log]($RUN_URL)"
              exit 0
            fi
            sha=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null) || {
              gh issue comment "$issue" --body "Couldn't verify the matching agent PR commit. [Run log]($RUN_URL)"
              exit 0
            }
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              gh issue comment "$issue" --body "The matching agent PR has an unexpected commit. [Run log]($RUN_URL)"
              exit 0
            fi
          fi

          # Only hand-offs are picked up; a running agent is left alone.
          labels=$(gh issue view "$issue" --json labels --jq '.labels[].name')
          if grep -qx 'agent:in-progress' <<<"$labels"; then
            gh issue comment "$issue" --body "The agent is already running on this issue. Send \`/agent\` again when it finishes. [Run log]($RUN_URL)"
            exit 0
          fi
          if ! grep -qxE 'agent:(review|needs-human)' <<<"$labels"; then
            gh issue comment "$issue" --body "\`/agent\` only applies once the agent has handed the issue over (\`agent:review\` or \`agent:needs-human\`). To start it, a repository owner/admin must add \`agent:ready\`."
            exit 0
          fi
          if grep -qxE 'type:db|area:db' <<<"$labels"; then
            gh issue comment "$issue" --body "\`/agent\` can't run here: database work (migrations, RLS, edge functions) is reserved for humans."
            exit 0
          fi

          # Claim before the reusable call so another command cannot queue a
          # second run. agent.yml independently rechecks the actor, branch and SHA.
          gh issue edit "$issue" --remove-label agent:review --remove-label agent:needs-human --add-label agent:in-progress
          gh issue comment "$issue" --body "Picked up feedback from @$ACTOR. The agent is revising \`$branch\`. [Run log]($RUN_URL)"
          echo "start=true" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "initiator=$ACTOR" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$sha" >> "$GITHUB_OUTPUT"

  agent:
    needs: prepare
    if: needs.prepare.outputs.start == 'true'
    uses: ./.github/workflows/agent.yml
    with:
      issue: ${{ needs.prepare.outputs.issue }}
      branch: ${{ needs.prepare.outputs.branch }}
      reason: feedback
      initiator: ${{ needs.prepare.outputs.initiator }}
      expected_sha: ${{ needs.prepare.outputs.expected_sha }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

  cleanup:
    needs: [prepare, agent]
    if: >-
      always() && needs.prepare.outputs.start == 'true' &&
      (needs.agent.result == 'failure' || needs.agent.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ needs.prepare.outputs.issue }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Hand back a failed call
        run: |
          if gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx 'agent:in-progress'; then
            gh issue edit "$ISSUE" --remove-label agent:in-progress --add-label agent:needs-human
            gh issue comment "$ISSUE" --body "Agent run failed. [Run log]($RUN_URL)"
          fi
